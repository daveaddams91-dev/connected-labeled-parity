[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "connected-parity"
version = "1.0.0"
description = "Exact 2-adic valuations of connected labeled graphs and weakly connected digraphs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
